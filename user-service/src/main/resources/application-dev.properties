spring.application.name=user-service
server.port=8081

# PostgreSQL Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fintrack_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:password}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Settings
jwt.secret=${JWT_SECRET:8y/B?E(H+MbQeThVmYq3t6w9z$C&F)J@NcRfUjXn2r5u8x/A%D*G-KaPdSgVkYp3}
# Expiration time in milliseconds (e.g., 24 hours)
jwt.expiration=86400000

# Disable Google Cloud SQL auto-configuration for the 'dev' profile
spring.cloud.gcp.sql.enabled=false
# Disable Google Cloud Secret Manager for the 'dev' profile
spring.cloud.gcp.secretmanager.enabled=false