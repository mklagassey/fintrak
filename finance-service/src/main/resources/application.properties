# ===================================================================
# COMMON CONFIGURATION
# ===================================================================
# This profile will be active by default if no other profile is specified.
# For local development, we'll use 'dev'.
spring.profiles.active=dev

# ===================================================================
# JPA & HIBERNATE CONFIGURATION (Shared across all profiles)
# ===================================================================
# We use 'validate' because Flyway is now responsible for creating/managing the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# FLYWAY CONFIGURATION (Shared across all profiles)
# ===================================================================
# Flyway is enabled by default when the dependency is present.
spring.flyway.enabled=true

