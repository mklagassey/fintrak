# ===================================================================
# PRODUCTION DATABASE CONFIGURATION
# ===================================================================
# This configuration is used when the 'prod' profile is active.
# It leverages the Spring Cloud GCP starter for a secure connection to Cloud SQL.

# Explicitly enable Google Cloud SQL and Secret Manager auto-configuration for the 'prod' profile
spring.cloud.gcp.sql.enabled=true
spring.cloud.gcp.secretmanager.enabled=true

# Provide the unique connection name for your Cloud SQL instance.
# Format: <PROJECT_ID>:<REGION>:<INSTANCE_NAME>
spring.cloud.gcp.sql.instance-connection-name=fintrak-472601:us-central1:fintrack-postgres-instance

# Specify the database name within the Cloud SQL instance for this service.
spring.cloud.gcp.sql.database-name=fintrack_db

# The username and password should be injected as environment variables or pulled from Secret Manager.
# The GCP Starter will automatically construct the correct JDBC URL.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD} # Or use sm:// for Secret Manager
spring.datasource.driver-class-name=org.postgresql.Driver

# This tells Flyway to create its history table and "baseline" on version 1
# if it connects to a database that already has tables but no history.
spring.flyway.baseline-on-migrate=true