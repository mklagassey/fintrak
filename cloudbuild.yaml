steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/fintrack-repo/user-service:latest'
      - '.'
    dir: 'user-service'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/fintrack-repo/user-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY