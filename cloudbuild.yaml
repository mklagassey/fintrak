steps:
  # Step 1: Run the main Maven build from the root directory.
  - name: 'maven:3.9-eclipse-temurin-21'
    id: 'build-all-modules'
    entrypoint: 'mvn'
    args: ['clean', 'install', '-DskipTests']

  # Step 2: Build the user-service Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-user-service-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/fintrack-repo/user-service:latest' # Corrected name
      - '.'
    dir: 'user-service'

  # Step 3: Build the api-gateway Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-gateway-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/fintrack-repo/api-gateway:latest' # Corrected name
      - '.'
    dir: 'api-gateway'

# List both images to be pushed to Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/fintrack-repo/user-service:latest' # Corrected name
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/fintrack-repo/api-gateway:latest' # Corrected name

options:
  logging: CLOUD_LOGGING_ONLY