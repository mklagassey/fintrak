services:
  postgres-db:
    image: postgres:latest
    container_name: fintrack-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintrack_db
    ports:
      - "5432:5432"
    volumes:
      # Use a named volume managed by the container engine instead of a bind mount.
      - postgres-data:/var/lib/postgresql/data

# Define the named volume. The container engine will manage its lifecycle.
volumes:
  postgres-data:
